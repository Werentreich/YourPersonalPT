<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=nexa1">
<style>
@font-face{font-family:"Barlow";src:url(/assets/fonts/barlow-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(/assets/fonts/barlow-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(/assets/fonts/barlow-condensed-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--bg:#EEF0F4;--surface:#FFFFFF;--ink:#0B0D11;--muted:#5A606C;--line:#DEE1E7;--accent:#1B3BFF;--mark:#FFF1C2}
@media (prefers-color-scheme: dark){:root{--bg:#08090C;--surface:#121419;--ink:#F1F3F7;--muted:#9AA1AE;--line:#252932;--accent:#8FA2FF;--mark:#4A3B0C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
header a{color:var(--ink);text-decoration:none;font-weight:600}
h1{font:700 44px/1 "Barlow Condensed","Barlow",sans-serif;text-transform:uppercase;margin:28px 0 6px}
h2{font:700 24px/1.1 "Barlow Condensed","Barlow",sans-serif;text-transform:uppercase;margin:36px 0 8px}
h3{font-size:17px;margin:20px 0 4px}
p,li{color:var(--ink)}
.meta{color:var(--muted);font-size:15px}
a{color:var(--accent)}
mark{background:var(--mark);color:inherit;padding:0 4px;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
th,td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
footer{margin-top:48px;color:var(--muted);font-size:14px}
@media (max-width:560px){h1{font-size:36px}table{font-size:14px}}
</style>
